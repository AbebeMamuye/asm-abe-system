<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Asset Management System</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http: ws:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ui-avatars.com; media-src 'self' data:"
    />
    <script>
      // Early-stage silence for AbortError (media-play interruptions)
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.name === 'AbortError' || event.reason.message && event.reason.message.includes('play()'))) {
          event.preventDefault();
        }
      });
      const originalConsoleError = console.error;
      console.error = function() {
        if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('AbortError')) return;
        originalConsoleError.apply(console, arguments);
      };
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
